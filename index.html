<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6b4a3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WeddingReminder">
<meta name="description" content="Send WhatsApp reminders to your wedding guests">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192x192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

<title>Wedding Reminder Manager</title>
<style>
/* ── Reset & Base ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #f8f5f0;
  color: #2d2a26;
  min-height: 100vh;
  min-height: 100dvh;
  overscroll-behavior: none;
}

/* ── App Shell ── */
.app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

/* ── Header ── */
.header {
  background: linear-gradient(135deg, #6b4a3a 0%, #9c6b4e 100%);
  color: #fff;
  padding: 14px 16px;
  padding-top: max(14px, env(safe-area-inset-top));
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-text h1 { font-size: 18px; font-weight: 600; }
.header-text .sub { font-size: 12px; opacity: .7; margin-top: 1px; }
.header-actions { margin-left: auto; display: flex; gap: 8px; }
.icon-btn { background: rgba(255,255,255,.15); border: none; color: #fff; width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; }

/* ── Scrollable content ── */
.content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 80px; }

/* ── Bottom Nav ── */
.bottom-nav {
  display: flex;
  background: #fff;
  border-top: 1px solid #e8e0d8;
  padding-bottom: env(safe-area-inset-bottom);
  flex-shrink: 0;
  position: fixed;
  bottom: 0;
  left: 0; right: 0;
  z-index: 100;
  box-shadow: 0 -2px 12px rgba(0,0,0,.06);
}
.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 10px 4px 8px;
  cursor: pointer;
  color: #aaa;
  transition: color .15s;
  border: none;
  background: none;
  font-family: inherit;
}
.nav-item.active { color: #6b4a3a; }
.nav-item i { font-size: 22px; }
.nav-item span { font-size: 10px; font-weight: 500; }
.nav-badge { position: relative; }
.nav-badge::after {
  content: attr(data-count);
  position: absolute;
  top: -4px; right: -8px;
  background: #e74c3c;
  color: #fff;
  border-radius: 10px;
  font-size: 9px;
  font-weight: 700;
  padding: 1px 5px;
  min-width: 16px;
  text-align: center;
}

/* ── Page sections ── */
.page { display: none; }
.page.active { display: block; }

/* ── Stats bar ── */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  padding: 14px 14px 0;
}
.stat-card {
  background: #fff;
  border-radius: 12px;
  padding: 14px;
  border: 1px solid #e8e0d8;
}
.stat-card .sv { font-size: 28px; font-weight: 700; color: #6b4a3a; }
.stat-card .sl { font-size: 12px; color: #888; margin-top: 2px; }

/* ── Section card ── */
.section { margin: 12px 14px; background: #fff; border-radius: 14px; border: 1px solid #e8e0d8; overflow: hidden; }
.section-header {
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #f0ece8;
}
.section-header h2 { font-size: 15px; font-weight: 600; color: #2d2a26; display: flex; align-items: center; gap: 6px; }

/* ── Guest rows ── */
.guest-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid #f5f1ed;
  cursor: pointer;
  transition: background .1s;
  -webkit-user-select: none;
}
.guest-row:last-child { border-bottom: none; }
.guest-row:active { background: #f8f2ee; }
.avatar {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: #f0e8e3;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 600; color: #6b4a3a;
  flex-shrink: 0;
}
.guest-info { flex: 1; min-width: 0; }
.guest-info .gname { font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.guest-info .gphone { font-size: 12px; color: #888; margin-top: 1px; }
.guest-actions { display: flex; gap: 6px; }

/* ── Badges ── */
.badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 600; }
.badge-family { background: #fef3c7; color: #92400e; }
.badge-friend { background: #dbeafe; color: #1e40af; }
.badge-vip { background: #fce7f3; color: #9d174d; }
.badge-colleague { background: #d1fae5; color: #065f46; }
.badge-confirmed { background: #d1fae5; color: #065f46; }
.badge-pending { background: #fef3c7; color: #92400e; }

/* ── Event cards ── */
.event-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid #f5f1ed;
}
.event-card:last-child { border-bottom: none; }
.event-date-box {
  background: #6b4a3a;
  color: #fff;
  border-radius: 10px;
  padding: 8px 10px;
  text-align: center;
  min-width: 52px;
  flex-shrink: 0;
}
.event-date-box .day { font-size: 22px; font-weight: 700; line-height: 1; }
.event-date-box .mon { font-size: 10px; text-transform: uppercase; letter-spacing: .4px; opacity: .85; }
.event-info { flex: 1; min-width: 0; }
.event-info .ename { font-weight: 600; font-size: 14px; }
.event-info .emeta { font-size: 12px; color: #888; margin-top: 2px; }
.event-info .etag { display: inline-flex; align-items: center; gap: 3px; background: #e8f5e9; color: #2e7d32; font-size: 10px; border-radius: 4px; padding: 2px 7px; margin-top: 4px; font-weight: 500; }

/* ── Buttons ── */
.btn { padding: 10px 18px; border-radius: 10px; font-size: 14px; font-weight: 500; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 6px; transition: all .15s; font-family: inherit; }
.btn:active { transform: scale(0.97); }
.btn-primary { background: #6b4a3a; color: #fff; }
.btn-green { background: #25d366; color: #fff; }
.btn-outline { background: transparent; color: #6b4a3a; border: 1px solid #6b4a3a; }
.btn-danger { background: transparent; color: #e74c3c; border: 1px solid #e74c3c; }
.btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 8px; }
.btn-full { width: 100%; justify-content: center; }

/* ── Forms ── */
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 12px; font-weight: 600; color: #666; margin-bottom: 5px; }
input[type=text], input[type=tel], input[type=date], input[type=number], select, textarea {
  width: 100%;
  padding: 11px 14px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 15px;
  color: #2d2a26;
  background: #faf9f7;
  outline: none;
  -webkit-appearance: none;
  font-family: inherit;
  transition: border .2s;
}
input:focus, select:focus, textarea:focus { border-color: #9c6b4e; }
textarea { resize: none; min-height: 90px; }

/* ── Toggle pills ── */
.toggle-group { display: flex; background: #f0ece8; border-radius: 10px; padding: 3px; gap: 3px; }
.toggle-item { flex: 1; text-align: center; padding: 8px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; color: #888; transition: all .2s; }
.toggle-item.active { background: #fff; color: #6b4a3a; box-shadow: 0 1px 4px rgba(0,0,0,.1); }

/* ── Chip selector ── */
.chip-wrap { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  background: #f0e8e3; color: #6b4a3a;
  border-radius: 20px; padding: 5px 12px;
  font-size: 13px; font-weight: 500;
  cursor: pointer; border: 1px solid transparent;
  transition: all .15s;
}
.chip.sel { background: #6b4a3a; color: #fff; }

/* ── WhatsApp Preview ── */
.wa-preview { background: #e5ddd5; border-radius: 12px; overflow: hidden; margin: 0 14px 12px; }
.wa-topbar { background: #075e54; color: #fff; padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
.wa-topbar .wt-name { font-size: 14px; font-weight: 600; }
.wa-topbar .wt-status { font-size: 11px; opacity: .7; }
.wa-body { padding: 14px; }
.wa-bubble {
  background: #fff;
  border-radius: 0 10px 10px 10px;
  padding: 10px 13px;
  max-width: 90%;
  font-size: 13px;
  line-height: 1.55;
  box-shadow: 0 1px 2px rgba(0,0,0,.1);
}
.wa-time { font-size: 10px; color: #aaa; text-align: right; margin-top: 6px; }

/* Designer card bubble */
.dc-bubble { background: #fff; border-radius: 0 10px 10px 10px; max-width: 90%; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.1); }
.dc-inner { background: linear-gradient(135deg, #f5efe8 0%, #e8d5c4 100%); padding: 14px; }
.dc-eyebrow { font-size: 10px; color: #9c7a66; margin-bottom: 4px; }
.dc-name { font-size: 15px; font-weight: 700; color: #4a2c1e; }
.dc-event { font-size: 12px; color: #6b4a3a; font-weight: 600; margin-top: 2px; margin-bottom: 10px; }
.dc-divider { border: none; border-top: 1px solid #c9a98a; margin: 8px 0; }
.dc-row { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #5a3c2e; margin: 4px 0; }
.dc-footer { font-size: 11px; color: #9c7a66; margin-top: 10px; font-style: italic; }

/* ── Reminder rows ── */
.reminder-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid #f5f1ed;
}
.reminder-row:last-child { border-bottom: none; }
.rs-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.rs-pending { background: #f59e0b; }
.rs-sent { background: #10b981; }
.rs-scheduled { background: #6b4a3a; }
.rr-info { flex: 1; min-width: 0; }
.rr-info .rn { font-weight: 500; font-size: 13px; }
.rr-info .rd { font-size: 11px; color: #888; margin-top: 2px; }

/* ── Upload zone ── */
.upload-zone {
  margin: 0 14px 14px;
  border: 2px dashed #c9a98a;
  border-radius: 12px;
  padding: 28px 20px;
  text-align: center;
  cursor: pointer;
  background: #fdf9f6;
  transition: all .2s;
}
.upload-zone:active { background: #f8f2ee; }
.uz-icon { font-size: 40px; color: #c9a98a; }
.uz-text { font-size: 14px; color: #666; margin-top: 6px; }
.uz-sub { font-size: 11px; color: #aaa; margin-top: 4px; }

/* ── Divider ── */
.divider { height: 1px; background: #f0ece8; margin: 12px 0; }

/* ── Floating Add button ── */
.fab {
  position: fixed;
  bottom: calc(70px + env(safe-area-inset-bottom));
  right: 18px;
  width: 52px; height: 52px;
  border-radius: 50%;
  background: #6b4a3a;
  color: #fff;
  border: none;
  font-size: 24px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 16px rgba(107,74,58,.4);
  cursor: pointer;
  z-index: 99;
  transition: transform .15s;
}
.fab:active { transform: scale(0.93); }

/* ── Bottom sheet modal ── */
.sheet-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.45);
  z-index: 200;
  display: flex; align-items: flex-end;
  opacity: 0; transition: opacity .2s;
  pointer-events: none;
}
.sheet-overlay.open { opacity: 1; pointer-events: all; }
.sheet {
  background: #fff;
  border-radius: 20px 20px 0 0;
  padding: 0 0 env(safe-area-inset-bottom);
  width: 100%;
  max-height: 92vh;
  overflow-y: auto;
  transform: translateY(100%);
  transition: transform .3s cubic-bezier(.32,.72,0,1);
}
.sheet-overlay.open .sheet { transform: translateY(0); }
.sheet-handle { width: 36px; height: 4px; background: #e0dbd6; border-radius: 2px; margin: 12px auto 0; }
.sheet-title { font-size: 17px; font-weight: 600; padding: 16px 20px 12px; color: #2d2a26; }
.sheet-body { padding: 0 20px 24px; }

/* ── Install prompt ── */
.install-banner {
  margin: 12px 14px 0;
  background: linear-gradient(135deg, #4a2c1e, #6b4a3a);
  color: #fff;
  border-radius: 14px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.install-banner .ib-text { flex: 1; }
.install-banner .ib-title { font-weight: 600; font-size: 14px; }
.install-banner .ib-sub { font-size: 12px; opacity: .8; margin-top: 2px; }
.install-banner .ib-btn { background: #fff; color: #6b4a3a; border: none; border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; font-family: inherit; }
.install-banner .ib-close { background: none; border: none; color: rgba(255,255,255,.7); font-size: 18px; cursor: pointer; padding: 4px; }

/* ── How it works ── */
.how-step { display: flex; gap: 12px; padding: 10px 16px; }
.how-num { width: 26px; height: 26px; border-radius: 50%; background: #f0e8e3; color: #6b4a3a; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
.how-text { font-size: 13px; color: #555; line-height: 1.6; }

/* ── Toast ── */
.toast {
  position: fixed;
  top: calc(60px + env(safe-area-inset-top));
  left: 50%; transform: translateX(-50%) translateY(-10px);
  background: #1a1a1a;
  color: #fff;
  padding: 10px 18px;
  border-radius: 24px;
  font-size: 13px;
  white-space: nowrap;
  z-index: 9999;
  opacity: 0;
  pointer-events: none;
  transition: all .25s;
  display: flex; align-items: center; gap: 6px;
  box-shadow: 0 4px 16px rgba(0,0,0,.2);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.green { background: #065f46; }

/* ── Compose page ── */
.compose-section { margin: 12px 14px; }
.compose-label { font-size: 12px; font-weight: 600; color: #6b4a3a; text-transform: uppercase; letter-spacing: .6px; margin-bottom: 8px; display: block; }

/* ── Responsive fixes ── */
@media (min-width: 480px) {
  .stats-grid { grid-template-columns: repeat(4, 1fr); }
}
</style>
</head>
<body>

<div class="app">

  <!-- Header -->
  <div class="header">
    <span style="font-size:24px">🌹</span>
    <div class="header-text">
      <h1>Wedding Reminders</h1>
      <div class="sub" id="headerSub">Manage guests &amp; WhatsApp</div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="openNotifSettings()" title="Notifications"><i class="ti ti-bell"></i></button>
    </div>
  </div>

  <!-- Content -->
  <div class="content" id="content">
    <!-- pages rendered here -->
  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchPage('guests')" id="nav-guests">
      <i class="ti ti-users"></i>
      <span>Guests</span>
    </button>
    <button class="nav-item" onclick="switchPage('events')" id="nav-events">
      <i class="ti ti-calendar-event"></i>
      <span>Events</span>
    </button>
    <button class="nav-item" onclick="switchPage('compose')" id="nav-compose">
      <i class="ti ti-brand-whatsapp"></i>
      <span>Compose</span>
    </button>
    <button class="nav-item" onclick="switchPage('reminders')" id="nav-reminders">
      <div class="nav-badge" id="reminderBadge">
        <i class="ti ti-bell-ringing"></i>
      </div>
      <span>Reminders</span>
    </button>
  </nav>

</div>

<!-- FAB -->
<button class="fab" id="fab" onclick="handleFab()"><i class="ti ti-plus"></i></button>

<!-- Bottom Sheet -->
<div class="sheet-overlay" id="sheetOverlay" onclick="closeSheet(event)">
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="sheetTitle"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Hidden file input -->
<input type="file" id="fileInput" accept=".csv,.xlsx,.xls" style="display:none" onchange="handleFileImport(event)">

<script>
// ──────── STATE ────────
let state = {
  page: 'guests',
  guests: [],
  events: [],
  reminders: [],
  msgType: 'designer',
  selectedGuests: [],
  selectedEventId: null,
  installPrompt: null,
  showInstallBanner: true,
};

// Load from localStorage
function loadState() {
  try {
    const saved = localStorage.getItem('weddingApp');
    if (saved) {
      const parsed = JSON.parse(saved);
      state.guests = parsed.guests || defaultGuests();
      state.events = parsed.events || defaultEvents();
      state.reminders = parsed.reminders || [];
    } else {
      state.guests = defaultGuests();
      state.events = defaultEvents();
      state.reminders = defaultReminders();
    }
    if (!state.selectedEventId && state.events.length) {
      state.selectedEventId = state.events[0].id;
    }
  } catch(e) {
    state.guests = defaultGuests();
    state.events = defaultEvents();
    state.reminders = defaultReminders();
  }
}

function saveState() {
  try {
    localStorage.setItem('weddingApp', JSON.stringify({
      guests: state.guests,
      events: state.events,
      reminders: state.reminders,
    }));
  } catch(e) {}
}

function defaultGuests() {
  return [
    { id:1, name:'Priya Sharma', phone:'+919876543210', relation:'family', rsvp:'confirmed' },
    { id:2, name:'Rahul Verma', phone:'+918765432109', relation:'friend', rsvp:'pending' },
    { id:3, name:'Meena Kapoor', phone:'+917654321098', relation:'family', rsvp:'confirmed' },
    { id:4, name:'Arjun Nair', phone:'+916543210987', relation:'colleague', rsvp:'pending' },
    { id:5, name:'Sunita Patel', phone:'+915432109876', relation:'friend', rsvp:'confirmed' },
  ];
}
function defaultEvents() {
  return [
    { id:1, name:'Mehendi Ceremony', date:'2025-08-14', time:'4:00 PM', venue:'Home Garden', remindDays:2 },
    { id:2, name:'Sangeet Night', date:'2025-08-15', time:'7:00 PM', venue:'Rose Banquet Hall', remindDays:1 },
    { id:3, name:'Wedding Ceremony', date:'2025-08-16', time:'11:00 AM', venue:'Grand Palace', remindDays:3 },
    { id:4, name:'Reception', date:'2025-08-16', time:'7:00 PM', venue:'Grand Palace Lawn', remindDays:1 },
  ];
}
function defaultReminders() {
  return [
    { id:1, guestId:1, eventId:3, status:'scheduled', scheduledFor:'2025-08-13' },
    { id:2, guestId:3, eventId:3, status:'sent', scheduledFor:'2025-08-13' },
    { id:3, guestId:5, eventId:1, status:'pending', scheduledFor:'2025-08-12' },
  ];
}

// ──────── HELPERS ────────
function initials(n) { return n.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2); }
function formatDate(d) {
  if(!d) return '—';
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' });
}
function dayMon(d) {
  const dt = new Date(d + 'T00:00:00');
  return { day: dt.getDate(), mon: dt.toLocaleString('default',{month:'short'}).toUpperCase() };
}
function guestById(id) { return state.guests.find(g=>g.id===id); }
function eventById(id) { return state.events.find(e=>e.id===id); }
function pendingReminders() { return state.reminders.filter(r=>r.status!=='sent').length; }

// ──────── TOAST ────────
let toastTimer;
function toast(msg, type='') {
  const t = document.getElementById('toast');
  t.innerHTML = msg;
  t.className = `toast show ${type}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

// ──────── SHEET ────────
function openSheet(title, bodyHTML) {
  document.getElementById('sheetTitle').textContent = title;
  document.getElementById('sheetBody').innerHTML = bodyHTML;
  const ov = document.getElementById('sheetOverlay');
  ov.style.display = 'flex';
  requestAnimationFrame(() => ov.classList.add('open'));
}
function closeSheet(e) {
  if(e && e.target !== document.getElementById('sheetOverlay')) return;
  const ov = document.getElementById('sheetOverlay');
  ov.classList.remove('open');
  setTimeout(() => ov.style.display = 'none', 300);
}
function closeSheetDirect() {
  const ov = document.getElementById('sheetOverlay');
  ov.classList.remove('open');
  setTimeout(() => ov.style.display = 'none', 300);
}

// ──────── PAGE SWITCH ────────
function switchPage(page) {
  state.page = page;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('nav-' + page).classList.add('active');
  const subtitles = { guests:'Manage your guest list', events:'Wedding event schedule', compose:'Send WhatsApp messages', reminders:'Scheduled notifications' };
  document.getElementById('headerSub').textContent = subtitles[page];
  // FAB visibility
  document.getElementById('fab').style.display = ['guests','events','reminders'].includes(page) ? 'flex' : 'none';
  render();
}

function handleFab() {
  if(state.page === 'guests') openAddGuest();

// ──────── MESSAGE BUILDERS ────────
function buildTextMsg(g, ev) {
  return `Dear ${g.name},\n\nThis is a warm reminder for *${ev.name}* happening on *${formatDate(ev.date)}* at *${ev.time}*.\n\n📍 Venue: ${ev.venue}\n\nWe look forward to celebrating with you! 🌹\n\n— With love & joy`;
}
function buildDesignerMsg(g, ev) {
  return `🌹 *Wedding Invitation Reminder* 🌹\n\n👤 Dear ${g.name},\n\n✨ *Event:* ${ev.name}\n📅 *Date:* ${formatDate(ev.date)}\n🕐 *Time:* ${ev.time}\n📍 *Venue:* ${ev.venue}\n\n━━━━━━━━━━━━━━\n\n"We are counting down the days to celebrate this special occasion with you!"\n\nWe look forward to your presence! 💐\n\n— With all our love`;
}
function buildMsg(g, ev) {
  return state.msgType === 'text' ? buildTextMsg(g, ev) : buildDesignerMsg(g, ev);
}
function waLink(phone, msg) {
  const clean = phone.replace(/[\s\-\(\)]/g,'');
  return `https://wa.me/${clean.replace('+','')}?text=${encodeURIComponent(msg)}`;
}

// ──────── ACTIONS ────────
function toggleGuest(id) {
  const i = state.selectedGuests.indexOf(id);
  if(i>-1) state.selectedGuests.splice(i,1);
  else state.selectedGuests.push(id);
  render();
}
function selectAll() {
  state.selectedGuests = state.guests.map(g=>g.id);
  render();
}

function sendAll() {
  const ev = eventById(state.selectedEventId) || state.events[0];
  if(!ev) { toast('Please select an event'); return; }
  const targets = state.selectedGuests.length
    ? state.guests.filter(g => state.selectedGuests.includes(g.id))
    : state.guests;
  if(!targets.length) { toast('No guests selected'); return; }
  targets.forEach((g, i) => {
    setTimeout(() => window.open(waLink(g.phone, buildMsg(g, ev)), '_blank'), i * 700);
  });
  toast(`<i class="ti ti-brand-whatsapp"></i> Opening WhatsApp for ${targets.length} guest${targets.length>1?'s':''}…`, 'green');
}

function sendEventToAll(eventId) {
  const ev = eventById(eventId);
  state.guests.forEach((g, i) => {
    setTimeout(() => window.open(waLink(g.phone, buildMsg(g, ev)), '_blank'), i * 700);
  });
  toast(`<i class="ti ti-brand-whatsapp"></i> Sending to all ${state.guests.length} guests`, 'green');
}

function sendReminderNow(id) {
  const r = state.reminders.find(x=>x.id===id);
  const g = guestById(r.guestId);
  const ev = eventById(r.eventId);
  window.open(waLink(g.phone, buildMsg(g, ev)), '_blank');
  r.status = 'sent';
  saveState();
  toast('<i class="ti ti-check"></i> Opened WhatsApp for ' + g.name, 'green');
  render();
}

function openNotifSettings() {
  openSheet('Notifications', `

      Enable notifications to get alerted on your phone when it's time to send a reminder.

    </button>
    <p style="font-size:11px;color:#aaa;text-align:center">You'll only receive reminders you've scheduled in the app</p>
  `);

async function requestNotifPermission() {
  if(!('Notification' in window)) { toast('Notifications not supported on this browser'); return; }
  const perm = await Notification.requestPermission();
  if(perm === 'granted') {
    toast('<i class="ti ti-check"></i> Notifications enabled!', 'green');
    scheduleReminderChecks();
    closeSheetDirect();
  } else {
    toast('Notification permission denied');
  }
}
function scheduleReminderChecks() {
  if('serviceWorker' in navigator && navigator.serviceWorker.controller) {
    const enriched = state.reminders.map(r => ({
      ...r,
      guestName: guestById(r.guestId)?.name || '?',
      eventName: eventById(r.eventId)?.name || '?',
    }));
    navigator.serviceWorker.controller.postMessage({ type:'CHECK_REMINDERS', reminders: enriched });
  }
}

// ──────── PWA INSTALL ────────
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  state.installPrompt = e;
  render();
});
function triggerInstall() {
  if(!state.installPrompt) return;
  state.installPrompt.prompt();
  state.installPrompt.userChoice.then(r => {
    if(r.outcome === 'accepted') {
      toast('<i class="ti ti-check"></i> App installed!', 'green');
      state.showInstallBanner = false;
    }
    state.installPrompt = null;
    render();
  });
}
window.addEventListener('appinstalled', () => {
  toast('<i class="ti ti-check"></i> App installed successfully!', 'green');
  state.showInstallBanner = false;
  render();
});

// ──────── SERVICE WORKER ────────
if('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./')
    .then(reg => {
      console.log('SW registered', reg.scope);
      // Check reminders on load
      setTimeout(scheduleReminderChecks, 1000);
    })
    .catch(err => console.log('SW error', err));
}

// ──────── INIT ────────
loadState();
if(state.events.length) state.selectedEventId = state.events[0].id;
render();
</script>
</body>
</html>
